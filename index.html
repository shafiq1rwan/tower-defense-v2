<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2432" />
    <meta name="description" content="Deploy your troops, hold the lane and smash the goblin castle." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tiny Siege" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Tiny Siege</title>

    <style>
      @font-face {
        font-family: 'Luckiest Guy';
        src: url('fonts/luckiest-guy-400.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'Baloo 2';
        src: url('fonts/baloo2-600.woff2') format('woff2');
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: 'Baloo 2';
        src: url('fonts/baloo2-800.woff2') format('woff2');
        font-weight: 800;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b2432;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
      }

      /* Shown until Phaser's preloader takes over, then faded out. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 26px;
        background: radial-gradient(ellipse at 50% 35%, #33445e 0%, #1b2432 70%);
        color: #f4e2c0;
        font-family: 'Baloo 2', system-ui, sans-serif;
        transition: opacity 0.45s ease;
        z-index: 10;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash h1 {
        font-family: 'Luckiest Guy', system-ui, sans-serif;
        font-size: clamp(34px, 8vw, 68px);
        letter-spacing: 2px;
        color: #ffd479;
        text-shadow: 0 4px 0 #8a4a1e, 0 8px 18px rgba(0, 0, 0, 0.55);
      }
      #splash .bar {
        width: min(320px, 62vw);
        height: 14px;
        border-radius: 999px;
        background: #10151f;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.7);
        overflow: hidden;
      }
      #splash .bar i {
        display: block;
        height: 100%;
        width: 35%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffb03a, #ffe08a);
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(400%);
        }
      }
      #splash p {
        font-size: 15px;
        opacity: 0.72;
        font-weight: 600;
      }
      #splash noscript {
        color: #ff9f9f;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="splash">
      <h1>Tiny Siege</h1>
      <div class="bar"><i></i></div>
      <p>Sharpening the swords&hellip;</p>
      <noscript>This game needs JavaScript enabled.</noscript>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
